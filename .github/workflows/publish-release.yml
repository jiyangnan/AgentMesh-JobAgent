name: Publish versioned release

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-versioned-release
  cancel-in-progress: false

jobs:
  native-gate:
    uses: ./.github/workflows/native-client.yml
    permissions:
      contents: read

  publish:
    needs: native-gate
    runs-on: ubuntu-latest
    env:
      HOME: ${{ github.workspace }}/../jobagent-release-ci/home
      USERPROFILE: ${{ github.workspace }}/../jobagent-release-ci/home
      CODEX_HOME: ${{ github.workspace }}/../jobagent-release-ci/codex
      XDG_CONFIG_HOME: ${{ github.workspace }}/../jobagent-release-ci/config
      XDG_CACHE_HOME: ${{ github.workspace }}/../jobagent-release-ci/cache
      XDG_DATA_HOME: ${{ github.workspace }}/../jobagent-release-ci/data
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          package_version = {}
          exec(Path("src/jobagent/__init__.py").read_text(), package_version)
          skill_versions = []
          for path in (
              Path("skills/claude-code/SKILL.md"),
              Path("skills/openclaw-job-agent/SKILL.md"),
          ):
              for line in path.read_text().splitlines():
                  if line.startswith("version:"):
                      skill_versions.append(line.split(":", 1)[1].strip())
                      break
          versions = [package_version["__version__"], *skill_versions]
          if versions != [version, version, version]:
              raise SystemExit(f"version mismatch: project={version}, surfaces={versions}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
          PY

      - name: Test public client
        run: |
          python -c 'import os; from pathlib import Path; [Path(os.environ[key]).mkdir(parents=True, exist_ok=True) for key in ("HOME", "USERPROFILE", "CODEX_HOME", "XDG_CONFIG_HOME", "XDG_CACHE_HOME", "XDG_DATA_HOME")]'
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Validate native Skill distribution
        # Codex Skill frontmatter intentionally has no version field. The
        # installed skill_contract must agree with the package release version.
        run: python scripts/ci/native_package_gate.py

      - name: Headed Liepin collection recovery gate
        # The headed fixture gate uses a fresh profile and blocks external traffic.
        # It never opens a customer session or sends recruiting actions.
        run: |
          xvfb-run -a env PYTHONPATH=src python scripts/ci/liepin_collection_recovery_gate.py

      - name: Build and smoke-test release wheel
        # Retains the legacy CLI help check and adds a fresh wheel-only native
        # contract/Skill smoke. This does not replace real host UI acceptance.
        run: |
          python -m pip install build
          python -m build
          python scripts/ci/native_package_gate.py --wheel-dir dist

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text()
          start_marker = f"## [{version}]"
          start = changelog.find(start_marker)
          if start < 0:
              raise SystemExit(f"missing changelog section: {start_marker}")
          end = changelog.find("\n## [", start + len(start_marker))
          if end < 0:
              end = len(changelog)
          Path("/tmp/jobagent-release-notes.md").write_text(
              changelog[start:end].strip() + "\n"
          )
          PY

      - name: Publish immutable version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Job Agent $TAG" \
            --notes-file /tmp/jobagent-release-notes.md
