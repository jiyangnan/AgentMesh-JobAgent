name: Native client package and protocol gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-protocol:
    name: Native client / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Tests and package smoke use disposable homes, never a developer's profile.
    env:
      HOME: ${{ github.workspace }}/../jobagent-native-ci/home
      USERPROFILE: ${{ github.workspace }}/../jobagent-native-ci/home
      CODEX_HOME: ${{ github.workspace }}/../jobagent-native-ci/codex
      APPDATA: ${{ github.workspace }}/../jobagent-native-ci/appdata
      LOCALAPPDATA: ${{ github.workspace }}/../jobagent-native-ci/localappdata
      XDG_CONFIG_HOME: ${{ github.workspace }}/../jobagent-native-ci/config
      XDG_CACHE_HOME: ${{ github.workspace }}/../jobagent-native-ci/cache
      XDG_DATA_HOME: ${{ github.workspace }}/../jobagent-native-ci/data
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare isolated test homes and dependencies
        run: |
          set -euo pipefail
          python -c 'import os; from pathlib import Path; [Path(os.environ[key]).mkdir(parents=True, exist_ok=True) for key in ("HOME", "USERPROFILE", "CODEX_HOME", "APPDATA", "LOCALAPPDATA", "XDG_CONFIG_HOME", "XDG_CACHE_HOME", "XDG_DATA_HOME")]'
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Linux full public-client tests
        if: runner.os == 'Linux'
        run: python -m pytest -q
      - name: Windows installer, Skill, upgrade, lock and atomic-state tests
        if: runner.os == 'Windows'
        run: |
          python -m pytest -q tests/test_installers.py tests/test_codex_skill.py tests/test_codex_upgrade_entry.py tests/test_native_command_lock.py tests/test_atomic_state.py tests/test_native_package_gate.py
      - name: Validate Codex Skill metadata and source/package equivalence
        run: python scripts/ci/native_package_gate.py
      - name: Build and verify an isolated wheel installation
        # Package/protocol checks only; no credentials, recruiting actions or
        # native host UI tools. This does not certify real Computer Use behavior.
        run: |
          set -euo pipefail
          python -m build --wheel
          python scripts/ci/native_package_gate.py --wheel-dir dist
